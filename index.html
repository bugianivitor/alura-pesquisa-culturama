<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <main>
        <section>
            <form action="">
                <fieldset>
                    <!-- Dados pessoais -->
                    <legend>Dados Pessoais</legend>
                        <label for="userName">Nome</label>
                        <input type="text" name="userName" id="userName" required>
                        <br>
                        <label for="userAge">Idade</label>
                        <input type="number" name="userAge" id="userAge" min="12" max="100" required>
                        <br>
                        <label for="birthDate">Data de nascimento</label>
                        <input type="date" name="birthDate" id="birthDate">
                        <br>
                        <label for="userEmail">E-mail</label>
                        <input type="email" name="userEmail" id="userEmail" required>
                        <br>
                        <label for="userPhoneNumber">Telefone</label>
                        <input type="tel" name="userPhoneNumber" id="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+Número">
                        <br>
                        <label for="userImage">Upload de foto</label>
                        <input type="file" name="userImage" id="userImage" accept="image/*">
                </fieldset>
                <br>
                <button type="submit">Enviar</button> 



            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>

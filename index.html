<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/estilo.css">
    <link rel="icon" href="img/culturama-favico.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Unbounded:wght@200..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
        <header>
            <img src="img/logo-culturama.png" alt="logo culturama">
            <h1>Pesquisa de opinião</h1>
        </header>
        <section>
            <form action="sucesso.html" method="get">
                 <fieldset>
                    <legend>Dados Pessoais</legend>
                        <label for="userName">Nome</label>
                        <input type="text" name="userName" id="userName" required>
                        <br>
                        <label for="userAge">Idade</label>
                        <input type="number" name="userAge" id="userAge" min="12" max="100" required>
                        <br>
                        <label for="birthDate">Data de nascimento</label>
                        <input type="date" name="birthDate" id="birthDate">
                        <br>
                        <label for="userEmail">E-mail</label>
                        <input type="email" name="userEmail" id="userEmail" required>
                        <br>
                        <label for="userPhoneNumber">Telefone</label>
                        <input type="tel" name="userPhoneNumber" id="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+Número" aria-describedby="phoneHelp">
                        <small id="phoneHelp">Preencha com 11 dígitos, no formato: DDD + número sem espaços ou hífen.</small>
                        <br>
                        <label for="userImage">Upload de foto</label>
                        <input type="file" name="userImage" id="userImage" accept="image/*" aria-describedby="imgHelp">
                        <small id="imgHelp">Envie uma foto no formato PNG ou JPEG.</small>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Perfil</legend>                    
                    <p>Gênero:</p>
                    <input type="radio" name="userGender" id="userGenderFeminino" value="feminino">
                    <label for="userGenderFeminino">Feminino</label>
                    <input type="radio" name="userGender" id="userGenderMasculino" value="masculino">
                    <label for="userGenderMasculino">Masculino</label>
                    <input type="radio" name="userGender" id="userGenderNotInformed" value="notInformed">
                    <label for="userGenderNotInformed">Prefiro não informar</label>
                    <br>
                    <label for="maritalStatus">Estado civil:</label>
                    <select name="maritalStatus" id="maritalStatus">
                        <option value="notInformed"></option>
                        <option value="casado">Casado</option>
                        <option value="solteiro">Solteiro</option>
                        <option value="divorciado">Divorciado</option>
                        <option value="viuvo">Viúvo</option>
                    </select>
                    <br>
                    <label for="state">Estado:</label>
                    <select name="state" id="state" required>
                        <option value="acre">Acre</option>
                        <option value="alagoas">Alagoas</option>
                        <option value="amazonas">Amazonas</option>
                        <option value="bahia">Bahia</option>
                        <option value="ceara">Ceará</option>
                        <option value="distritoFederal">Distrito Federal</option>
                        <option value="espiritoSanto">Espirito Santo</option>
                        <option value="goias">Goiás</option>
                        <option value="maranhao">Maranhão</option>
                        <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                        <option value="matoGrosso">Mato Grosso</option>
                        <option value="minasGerais">Minas Gerais</option>
                        <option value="para">Pará</option>
                        <option value="paraiba">Paraíba</option>
                        <option value="parana">Paraná</option>
                        <option value="pernambuco">Pernambuco</option>
                        <option value="piaui">Piauí</option>
                        <option value="rioDeJaneiro">Rio de Janeiro</option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                        <option value="rondonia">Rondônia</option>
                        <option value="roraima">Roraima</option>
                        <option value="santaCatarina">Santa Catarina</option>
                        <option value="saoPaulo">São Paulo</option>
                        <option value="sergipe">Sergipe</option>
                        <option value="tocantins">Tocantins</option>
                    </select>
                    <br>
                    <label for="userCity">Cidade:</label>
                    <input type="text" name="userCity" id="userCity">
                </fieldset>
                <br>
                <fieldset>
                    <legend>Hábitos</legend>
                    <p>Redes sociais:</p>
                    <input type="checkbox" name="social" id="socialInstagram" value="instagram">
                    <label for="socialInstagram">Instagram</label> <br>
                    <input type="checkbox" name="social" id="socialFacebook" value="facebook">
                    <label for="socialFacebook">Facebook</label> <br>
                    <input type="checkbox" name="social" id="socialLinkedIn" value="linkedIn">
                    <label for="socialLinkedIn">Linked In</label> <br>
                    <input type="checkbox" name="social" id="socialX" value="X">
                    <label for="socialX">X</label>
                    <br>
                    <label for="musicStyle">Estilo musical:</label>
                    <input type="text" name="userMusicStyle" id="musicStyle">
                    <datalist id="styleTypes">
                        <option value="rock">
                        <option value="pop">
                        <option value="samba">
                        <option value="sertanejo">
                    </datalist><br>
                    <label for="userFavoritColor">Cor favorita:</label>
                    <input type="color" name="userFavoritColor" id="userFavoritColor">
                </fieldset>
                <br>
                <fieldset>
                    <legend>Satisfação</legend>
                    <p>Satisfação com atendimento:</p>                    
                    <input type="radio" name="satisfaction" id="great">
                    <label for="great">Ótimo</label>
                    <input type="radio" name="satisfaction" id="good">
                    <label for="good">Bom</label>
                    <input type="radio" name="satisfaction" id="regular">
                    <label for="regular">Regular</label>
                    <input type="radio" name="satisfaction" id="bad">
                    <label for="bad">Ruim</label>
                    <br>
                    <label for="satisfacaoTexto">Deixe um comentário:</label>
                    <textarea name="satisfacaoTexto" id="satisfacaoTexto"></textarea><br>
                </fieldset>
                <br>
                <fieldset>
                    <legend>Confirmações</legend>
                    <input type="checkbox" name="userLGPD" id="userLGPDTerm" value="accepted" required>
                    <label for="userLGPDTerm">Eu aceito participar da pesquisa</label> <br>
                    <input type="checkbox" name="userGetResult" id="getResult" value="accepted">
                    <label for="getResult">Desejo receber o resultado por e-mail</label>
                </fieldset>
                <br>
                <button type="submit" aria-label="Enviar os dados do formulário.">Enviar</button>
                <button type="reset" aria-label="Limpar os dados do formulário.">Limpar</button>
            </form>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
